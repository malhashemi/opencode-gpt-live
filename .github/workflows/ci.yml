name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Started by the Release workflow for release-please's pull request: GitHub does not run
  # workflows for pull requests opened by GitHub Actions, and main requires these checks.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin (format, lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  native:
    name: Helper lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each OS compiles different platform code (ducking, audio backends).
        os: [macos-15, ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config cmake
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo clippy --manifest-path native/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path native/Cargo.toml --locked

  helper:
    name: Helper build
    uses: ./.github/workflows/build-helper.yml
