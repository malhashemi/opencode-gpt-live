# Releases are driven by release-please: conventional commits on main keep a release PR up
# to date (version bump + CHANGELOG). Merging that PR creates the GitHub release, and the
# jobs below build the audio helper for every platform, attach the binaries and SHA256SUMS
# to the release, and publish the platform packages and the plugin to npm.
#
# To finish a release that failed part-way, run this workflow manually with the tag: it
# rebuilds the helpers from that tag, replaces the release assets and publishes whatever is
# not on npm yet.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)publish, e.g. v0.1.0
        required: true

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Pull requests opened with the workflow token do not trigger CI, but main requires its
      # checks. Start CI on the release branch so the release pull request can merge normally.
      - name: Run CI on the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" \
            --json headRefName -q '.[0].headRefName')
          if [ -n "$branch" ]; then
            gh workflow run ci.yml -R "$GITHUB_REPOSITORY" --ref "$branch"
            echo "Started CI on $branch"
          else
            echo "No open release pull request"
          fi

  # Decides what to publish: the release release-please just created, or the tag given to a
  # manual run.
  plan:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.result != 'failure' }}
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          CREATED: ${{ needs.release-please.outputs.created }}
          CREATED_TAG: ${{ needs.release-please.outputs.tag }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null
          elif [ "$CREATED" = "true" ]; then
            tag="$CREATED_TAG"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "publish=true"
            echo "tag=$tag"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

  helper:
    needs: plan
    # Explicit status checks: release-please is skipped on manual runs, which would otherwise skip these too.
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.publish == 'true' }}
    uses: ./.github/workflows/build-helper.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      ref: ${{ needs.plan.outputs.tag }}

  publish:
    needs: [plan, helper]
    # Explicit status checks: release-please is skipped on manual runs, which would otherwise skip these too.
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      # npm trusted publishing (OIDC, no tokens) and provenance.
      id-token: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Never restore caches into a release build.
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - uses: actions/download-artifact@v8
        with:
          pattern: helper-*
          path: dist
          merge-multiple: true

      - name: Attach binaries to the GitHub release
        run: |
          cd dist
          sha256sum gpt-live-host-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" gpt-live-host-* SHA256SUMS --clobber

      - name: Publish platform packages
        run: |
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            ext=""
            if [[ "$target" == win32-* ]]; then ext=".exe"; fi
            name="opencode-gpt-live-$target"
            bun scripts/package-platform.ts "$target" "dist/gpt-live-host-$target$ext"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published"
            else
              # "./" matters: without it npm reads "npm/<name>" as a GitHub repository.
              npm publish "./npm/$name" --provenance --access public
            fi
          done

      - name: Publish the plugin
        run: |
          bun scripts/prepare-publish.ts
          if npm view "opencode-gpt-live@$VERSION" version >/dev/null 2>&1; then
            echo "opencode-gpt-live@$VERSION is already published"
          else
            npm publish --provenance --access public
          fi
